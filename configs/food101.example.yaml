input:
  trace: ../out/food101/requests.jsonl
  format: multimodal-independent-v1

server:
  backend: openai-chat
  # Which endpoint surface to use is `backend`; how to speak to it is `dialect`.
  # One of: openai, vllm, vllm-omni, sglang-omni, mstar, dynamo. Getting this
  # wrong is quiet -- most servers ignore fields they do not recognize -- so it
  # is declared rather than guessed.
  dialect: vllm
  base_url: http://127.0.0.1:8000/v1
  model: ByteDance-Seed/BAGEL-7B-MoT
  temperature: 0.0

replay:
  arrival_mode: trace-timed
  max_concurrency: 16
  stream_idle_timeout_seconds: 600

measurement:
  timeline: true

output:
  directory: ../out/food101-run
