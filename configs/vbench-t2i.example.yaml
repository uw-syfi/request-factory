input:
  trace: ../out/vbench-t2i/requests.jsonl
  format: multimodal-independent-v1

server:
  backend: openai-chat
  dialect: mstar
  base_url: http://127.0.0.1:8000/v1
  model: ByteDance-Seed/BAGEL-7B-MoT
  temperature: 0.0

replay:
  arrival_mode: saturated
  max_concurrency: 1
  stream_idle_timeout_seconds: 600

measurement:
  timeline: true

output:
  directory: ../out/vbench-t2i-run
  artifacts: images
