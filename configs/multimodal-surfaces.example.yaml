# Every media surface, one file. Copy the block you need.
#
# `backend` picks the endpoint; `dialect` picks the vocabulary spoken on it.
# A surface the chosen dialect does not serve is rejected at startup, so this
# file will not silently degrade into a 404 halfway through a measurement.

input:
  trace: ../out/multimodal/requests.jsonl
  format: multimodal-independent-v1

server:
  # Image editing and video generation are M* surfaces; ASR is served by
  # vLLM-Omni and SGLang-Omni but not by M*. See the surface table in README.md.
  backend: openai-videos
  dialect: mstar
  base_url: http://127.0.0.1:8000/v1
  model: THE_SERVED_MODEL_NAME
  temperature: 0.0

replay:
  arrival_mode: saturated
  max_concurrency: 8
  stream_idle_timeout_seconds: 600

output:
  directory: ../out/multimodal
  # Generated media lands here; artifact I/O happens after the response clock
  # stops and cannot inflate a measured latency.
  artifacts: artifacts
