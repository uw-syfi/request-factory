input:
  trace: ../out/seed-tts-en/requests.jsonl
  format: multimodal-independent-v1

server:
  backend: openai-speech
  base_url: http://127.0.0.1:8000/v1
  model: canopylabs/orpheus-3b-0.1-ft
  temperature: 0.0

replay:
  arrival_mode: saturated
  max_concurrency: 8
  stream_idle_timeout_seconds: 600

measurement:
  timeline: true

output:
  directory: ../out/seed-tts-orpheus-run
  artifacts: audio
