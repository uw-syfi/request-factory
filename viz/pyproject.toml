[project]
name = "req-frontend-viz"
version = "0.1.0"
description = "Draw what a Request Factory sweep measured. Optional; nothing in the Rust side depends on it."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9",
    "pyarrow>=15",
]

[project.scripts]
viz = "req_frontend_viz.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/req_frontend_viz"]
