    - id: executable-fidelity
      title: 第八章：selfcheck 用可执行检查维护测量语义

      steps:
        - id: selfcheck-orchestrator
          title: selfcheck 统一管理测试数据、stub timing、cache 状态和报告

          primary:
            file: src/bin/selfcheck/main.rs
            range:
              start_line: 90
              end_line: 158

          explanation: |
            selfcheck 自己生成 fixtures，并启动 timing 参数确定的 stub server。多个检查复用
            同一个 corpus；进入 prefix timing 检查前会重新启动 stub，以清空早先请求留下的
            cache 状态。它依次验证请求是否按时释放、timeline 是否对齐、TTFT/TPOT 是否符合
            stub timing，以及 usage/prefix 数据是否准确，最后写出 `selfcheck.json`。任何检查
            失败都会让进程返回非零状态。具体做法可从 [release fidelity 检查](code-ref:release-fidelity-check)
            看起。

          key_points:
            - "harness 必须负责启动并配置 stub server；无法确认配置的外部 server 不能作为 ground truth。"
            - "prefill delay 与 chunk delay 使用不同数值，避免 TTFT 和 TPOT 写反后仍然碰巧通过。"

