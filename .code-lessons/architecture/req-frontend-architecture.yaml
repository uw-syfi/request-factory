          explanation: |
            fidelity check 不能只返回一个没有上下文的 boolean。`Bound` 明确表示上限、下限
            或区间；`Check` 同时记录它要验证的结论、实测值、期望范围和判断依据，
            失败时可以直接看出差异。record reader 通过
            [独立声明公开 schema](code-ref:selfcheck-record-reader) 读取 JSONL，而不复用 writer
            的 private Rust type。因此，公开字段被重命名或删除时，selfcheck 会真正失败，
