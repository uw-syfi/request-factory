schema_version: 1

lesson:
  id: req-frontend-architecture
  title: "req-frontend：从类型化 trace 到可审计的 replay"
  description: >-
    这是一条长期维护的仓库级阅读路径。它先说明 crate 和 trace 数据契约的边界，
    再沿着 workload 准备、请求释放与执行、backend streaming、观测数据记录，完整跟踪
    一次 replay；最后介绍 tracegen、sweep、viz 和 selfcheck 如何复用并验证同一套公开契约。
    学习目标不是按文件逐一浏览，而是弄清每类数据由谁负责、数据怎样跨层传递，以及
    系统会在哪些边界提前拒绝错误，避免产出数值合理但语义错误的测量结果。

  metadata:
    type: architecture
    lifecycle: permanent

  chapters:
    - id: repository-boundary
      title: 第一章：仓库边界与可执行入口

      steps:
        - id: crate-products
          title: 一个共享 Rust library、四个 Rust 可执行程序和一个独立的 Python 可视化工具

          primary:
            file: Cargo.toml
            range:
              start_line: 8
              end_line: 56

          explanation: |
            `req_frontend` library 提供共享数据契约和 replay engine；`req-frontend`、
            `tracegen`、`sweep`、`selfcheck` 是四个用途不同的可执行程序。`runtime` feature
            将网络执行相关依赖与只使用 schema 的程序分开；[library 的公开模块](code-ref:library-facade)
            明确了关闭 `runtime` 后仍可复用的能力。Python [可视化工具](code-ref:viz-boundary)
            只读取已写入磁盘的结果，因此缺少绘图依赖不会导致长时间运行的 sweep 失败。

          key_points:
            - "Cargo.toml 定义产品边界；新增 binary 或 runtime 依赖必须先在这里显式声明。"
            - "只启用 schema 的 build 可以读写 canonical trace，无需引入 HTTP/Tokio 执行栈。"

          related:
            - id: library-facade
              title: library 中受 feature 控制的公开模块
              location:
                file: src/lib.rs
                range:
                  start_line: 1
                  end_line: 59
            - id: viz-boundary
              title: 与 replay 运行隔离的离线可视化工具
              location:
                file: viz/README.md
                range:
                  start_line: 1
                  end_line: 32

        - id: cli-axes
          title: CLI 集中声明协议、trace、请求释放、SLO 和观测配置

          primary:
            file: src/cli.rs
            range:
              start_line: 8
              end_line: 160

          explanation: |
            `Args` 集中保存一次 replay 的所有启动参数，包括 backend、trace declaration、
            arrival mode/rate、context 上限、SLO、timeline 和输出路径。CLI 不重复定义
            `ArrivalMode`，而是直接复用 [release.rs 中的共享类型](code-ref:arrival-mode-contract)。
            因此 VibeSim 等只使用 schema 的程序与真实 replay 会接受相同的配置值，并遵守
            相同的 open-loop/closed-loop 语义。

          related:
            - id: arrival-mode-contract
              title: open-loop 与 closed-loop 共用的 ArrivalMode 定义
              location:
                file: src/release.rs
                range:
                  start_line: 1
                  end_line: 45

    - id: trace-contract
      title: 第二章：trace 声明与 canonical schema

      steps:
        - id: declaration-before-data
          title: 打开 CSV 前，先用 TraceDeclaration 确定文件契约

          primary:
            file: src/schema/mod.rs
            range:
              start_line: 63
              end_line: 126

          explanation: |
            `TraceKind` 指明 workload 属于哪种 request family，以及它是否是 autoregressive。
            [TraceDeclaration](code-ref:trace-declaration) 再把 kind、彼此独立的 tags 和 source
            schema 组合成完整声明，并严格核对 CSV header。这样，即使某个文件碰巧能够被
            serde 解析，只要列定义与声明不一致，也不能进入执行。priority、SLO、media、
            omni 等能力都通过声明决定的固定列表示，而不是塞进一组含义模糊的 optional fields。

          key_points:
            - "文件声明的类型必须与实际列完全一致，检查发生在加载业务数据之前。"
            - "TraceKind 表示 request family；TraceTag 表示可独立附加的能力，两者职责不同。"

          related:
            - id: trace-declaration
              title: 声明解析、期望列集合与严格 header 校验
              location:
                file: src/schema/mod.rs
                range:
                  start_line: 227
                  end_line: 388
            - id: scheduling-columns
              title: priority tag 的独立调度声明
              location:
                file: src/schema/scheduling.rs
                range:
                  start_line: 24
                  end_line: 67

        - id: canonical-session-schema
          title: session-execution-v2 是生成器、replay 和 simulator 的统一交换格式

          primary:
            file: src/schema/session_execution_v2.rs
            range:
              start_line: 26
              end_line: 180

          explanation: |
            `ExecutionRow` 和完整的 `COLUMNS` 列表共同定义稳定的 CSV 格式契约。`load` 先核对
            header，再把原始记录转换成 `DeclaredRow`，同时检查 session、round、prefix 和
            tool wait 的约束。生成端通过 [PlanRow 和统一 writer](code-ref:canonical-writer)
            写出同一种 schema；其他读取程序无需各自实现一套 CSV 拼装逻辑。

          key_points:
            - "prefix_len 表示 trace 声明的可缓存前缀长度，不表示运行时实际命中了多少缓存。"
            - "arrival time 和 tool wait 来自输入；实际 release lag 是 replay 运行后得到的观测值。"

          related:
            - id: canonical-writer
              title: 从计划记录写出 canonical CSV 的统一路径
              location:
                file: src/schema/session_execution_v2.rs
                range:
                  start_line: 291
                  end_line: 360
            - id: request-shape-contracts
              title: media 尺寸、decoding 策略与 omni 输入片段
              location:
                file: src/schema/omni.rs
                range:
                  start_line: 19
                  end_line: 72

        - id: slo-contract
          title: SLO 支持 run-level 目标和每个 request 独立的指标上限

          primary:
            file: src/schema/slo.rs
            range:
              start_line: 27
              end_line: 220

          explanation: |
            `SloSpec` 表示整次运行统一采用的目标；`RequestSlo` 则让每个 request/round
            分别声明 `ttft_slo_ms`、`tpot_slo_ms` 和 `e2e_slo_ms`。三个字段都可独立留空，
            因此同一 session 内的 tool-call round 和长回答可以承担不同义务。priority 使用
            独立 tag，不属于 SLO。[SLO 来源解析](code-ref:slo-source-resolution) 明确规定 CLI
            和 sidecar 的优先级；[统一 fold](code-ref:slo-fold) 在同一遍数据上分别统计
            run-level 与 per-request attainment。

          related:
            - id: slo-source-resolution
              title: CLI 内联目标与 sidecar 文件的解析优先级
              location:
                file: src/slo_source.rs
                range:
                  start_line: 28
                  end_line: 94
            - id: slo-fold
              title: 判定每个 step，并汇总整次运行
              location:
                file: src/schema/slo.rs
                range:
                  start_line: 232
                  end_line: 384

    - id: workload-preparation
      title: 第三章：从 trace 记录构造可提交的 prompt

      steps:
        - id: workload-loader
          title: TraceFormat 选择 loader，ReplayWorkload 保留两种 workload 的差异

          primary:
            file: src/trace/mod.rs
            range:
              start_line: 15
              end_line: 117

          explanation: |
            loader 根据已经解析的 declaration，选择 session 或 independent trace 的读取路径，
            并拒绝当前执行 backend 尚未支持的 request family。`ReplayWorkload` 不抹平两种
            workload 的差异，只为它们真正共有的操作提供统一接口。[到达率缩放](code-ref:rate-scaling)
            会调整 arrival timeline，但 session 的后续 rounds 仍由该 session 自己推进，
            不会被当作新的独立 arrival。

          related:
            - id: rate-scaling
              title: 调整 arrival rate 并校验目标速率
              location:
                file: src/trace/mod.rs
                range:
                  start_line: 118
                  end_line: 205
            - id: session-step-shape
              title: session round 与 context 上限
              location:
                file: src/trace/session.rs
                range:
                  start_line: 12
                  end_line: 95
            - id: independent-shape
              title: independent request 的数据结构
              location:
                file: src/trace/independent.rs
                range:
                  start_line: 11
                  end_line: 54

        - id: workload-currency
          title: WorkloadSummary 明确区分到达单位与完成步骤

          primary:
            file: src/workload.rs
            range:
              start_line: 10
              end_line: 99

          explanation: |
            对 session trace，`--rate` 计算的是每秒到达多少个 session，而 throughput 计算的
            是每秒完成多少个 round/step；只有 independent trace 才是一条 arrival 对应一个
            step。`steps_per_workload_unit` 把两种单位之间的换算写入 summary，sweep boundary
            和 plot 可以直接读取，不必根据 trace 类型自行猜测。

        - id: prompt-construction
          title: TokenProvider 与 PromptBuilder 保持 token 不变，并串接 session 上下文

          primary:
            file: src/tokens.rs
            range:
              start_line: 11
              end_line: 103

          explanation: |
            `TokenProvider` 从共享 corpus 中截取确定的 token 序列。`PromptBuilder` 把前一轮
            实际生成的 output 接到下一轮 prompt，并同时记录计划前缀与实际前缀。
            tokenizer 和大 token pool 由 [corpus 构建路径](code-ref:corpus-construction) 创建一次，
            之后可在多个 sweep point 之间复用。请求直接发送 token IDs，避免客户端的
            decode/re-encode 改变服务器使用的 cache key。

          related:
            - id: corpus-construction
              title: 加载 tokenizer 并构建有上限的 token pool
              location:
                file: src/tokens.rs
                range:
                  start_line: 105
                  end_line: 175

    - id: replay-runtime
      title: 第四章：一次 replay 如何准备、释放并执行请求

      steps:
        - id: run-orchestrator
          title: run_once_reusing 按“先校验、后执行”的顺序组装整次运行

          primary:
            file: src/runner.rs
            range:
              start_line: 85
              end_line: 185

          explanation: |
            入口首先校验 CLI 参数、trace declaration 和 SLO，然后加载 workload。dry-run
            会在 tokenization 和网络访问之前返回；真实运行才构建 corpus 与 client、执行
            prefix-cache preflight，并创建容量受限的 timeline channel。后半段的
            [异步任务组装](code-ref:run-task-assembly) 统一启动并等待 log writer、status task、
            executor、timeline writer 和 summary 汇总，确保它们属于同一次运行。

          key_points:
            - "静态配置或 schema 错误应在昂贵的准备工作和网络请求之前暴露。"
            - "CorpusCache 由调用者持有：sweep 可以复用它，普通单次运行不会留下全局状态。"

          related:
            - id: run-task-assembly
              title: 启动 executor 和 writers，并等待最终 summary
              location:
                file: src/runner.rs
                range:
                  start_line: 183
                  end_line: 295

        - id: executor-state
          title: RunPolicy 保存执行规则，AppState 保存共享依赖，Stats 只记录观测值

          primary:
            file: src/executor/mod.rs
            range:
              start_line: 27
              end_line: 139

          explanation: |
            `RunPolicy` 保存并发上限、arrival mode 和 timeout 等本次运行不再变化的规则；
            `AppState` 汇集 client、token source、policy、共享计数器和输出通道。session 与
            independent executor 各自只处理自己的依赖关系和释放循环。
            [AdmissionOrder](code-ref:admission-order) 规定 closed-loop turn 和并发 permit 的
            获取顺序，避免两个受限资源互相等待。

          related:
            - id: admission-order
              title: closed-loop turn 与 request permit 的获取顺序
              location:
                file: src/executor/admission.rs
                range:
                  start_line: 28
                  end_line: 82
            - id: session-executor
              title: 在 session 内串行执行 rounds，并处理 arrival 与 tool wait
              location:
                file: src/executor/session.rs
                range:
                  start_line: 14
                  end_line: 123
            - id: independent-executor
              title: independent request 不承担 session 内依赖
              location:
                file: src/executor/independent.rs
                range:
                  start_line: 16
                  end_line: 88

    - id: backend-streaming
      title: 第五章：通过 adapter 统一 backend，并测量 streaming response

      steps:
        - id: normalized-backend
          title: Backend trait 把不同 wire protocol 转换为统一事件

          primary:
            file: src/backend/mod.rs
            range:
              start_line: 36
              end_line: 114

          explanation: |
            公共执行引擎只处理 token prompt、统一的 `GenRequest`、usage 和 `StreamEvent`。
            OpenAI、vLLM、SGLang 的 payload 与响应格式差异由 [wire adapter registry](code-ref:wire-registry)
            在启动时选择。这样，metrics 计算、完整性检查和 session output 续接只需实现一次，
            不会因为 backend 不同而产生三套逐渐分叉的逻辑。

          related:
            - id: wire-registry
              title: backend factory 与 usage 归一化辅助函数
              location:
                file: src/backend/wire/mod.rs
                range:
                  start_line: 1
                  end_line: 42
            - id: wire-openai
              title: OpenAI payload 和 SSE 解码 adapter
              location:
                file: src/backend/wire/openai.rs
                range:
                  start_line: 7
                  end_line: 82
            - id: wire-vllm
              title: vLLM token ID streaming adapter
              location:
                file: src/backend/wire/vllm.rs
                range:
                  start_line: 8
                  end_line: 105
            - id: wire-sglang
              title: SGLang payload 和 stream adapter
              location:
                file: src/backend/wire/sglang.rs
                range:
                  start_line: 22
                  end_line: 117

        - id: generation-client
          title: GenerationClient 从请求发出时开始计时，在 wire response 完成时停止

          primary:
            file: src/backend/client.rs
            range:
              start_line: 23
              end_line: 145

          explanation: |
            client 根据 backend 选择 endpoint，但 `run_step` 始终直接发送原始 token IDs。
            单调时钟 `send_instant` 是 TTFT 的起点；wire response 完成后立即停止计时，后续的
            output 重新分词和日志构造不会被算进服务器响应时间。所有 streaming events 由
            [StreamAccumulator](code-ref:stream-accumulator) 一次汇总，随后 prompt-echo
            完整性检查决定本轮 output 能否安全地接入下一轮 prompt。

          key_points:
            - "trace release lag 衡量客户端是否按时提交；TTFT 衡量提交后的服务器响应，两者起点不同。"
            - "文本重编码只用于诊断和 fallback，不能取代原始 token IDs 形成 cache key。"

          related:
            - id: stream-accumulator
              title: 一次汇总 chunks、token events、usage 和 timeline
              location:
                file: src/backend/stream.rs
                range:
                  start_line: 26
                  end_line: 154
            - id: prompt-integrity
              title: 判断 output 是否回显了 prompt，以及多出的 token 能否解释
              location:
                file: src/backend/integrity.rs
                range:
                  start_line: 13
                  end_line: 67
            - id: cache-preflight
              title: 正式 replay 前验证服务器会报告 cache usage
              location:
                file: src/backend/preflight.rs
                range:
                  start_line: 13
                  end_line: 102

    - id: observability
      title: 第六章：从单条请求日志汇总出 timeline、summary 和 SLO

      steps:
        - id: step-log
          title: StepLog 同时保存请求来源、SLO、priority 和实测结果

          primary:
            file: src/record.rs
            range:
              start_line: 16
              end_line: 160

          explanation: |
            `SourceRecord` 记录这一步来自哪个 session round 或 independent request，以及该
            row 声明的三项 SLO bounds、priority 和 release facts。`GenerationOutcome` 记录
            客户端实际测得的 TTFT/TPOT/E2E、完整性检查结果、server usage 和完成状态。
            [StepLog 构造器](code-ref:step-log-constructors) 把声明与观测组合起来，但不要求
            backend 层理解 trace family。JSONL schema v11 因而能逐 request 审计“要求什么”
            与“实际得到什么”。

          related:
            - id: step-log-constructors
              title: 两种请求来源共用的 StepLog 构造路径
              location:
                file: src/record.rs
                range:
                  start_line: 162
                  end_line: 280

        - id: timeline-channel
          title: TimelineSink 按 request 投递事件，慢磁盘不会阻塞测量路径

          primary:
            file: src/timeline.rs
            range:
              start_line: 54
              end_line: 187

          explanation: |
            每个 request 先在内存中收集带时间戳的事件，完成后把整条 `RequestTimeline`
            尝试写入容量受限的 channel。如果 channel 已满，就丢弃这一条 request 的 timeline
            并增加 dropped count，而不是阻塞后续请求提交。独立 writer 按
            [固定 Arrow schema](code-ref:timeline-writer) 写盘；summary 会明确报告丢弃数量，
            提醒读取者 timeline 只是抽样而非完整记录。

          related:
            - id: timeline-writer
              title: 固定的 Arrow 列，以及何时由 writer flush
              location:
                file: src/timeline/writer.rs
                range:
                  start_line: 39
                  end_line: 180

        - id: summary-fold
          title: JSONL writer 在同一遍扫描中计算 replay statistics 和 SLO

          primary:
            file: src/summary.rs
            range:
              start_line: 313
              end_line: 438

          explanation: |
            `RunSummary` 保存一次运行的完整汇总；`RunMetrics` 只暴露 sweep 长期需要的一小组
            稳定字段，其中包括 workload unit 到 step 的换算以及 timeline 丢弃数量。
            `write_logs` 每收到一条 `StepLog`，就在写 JSONL 的同时更新 replay statistics 和
            SLO，避免两份报表分别扫描数据后出现不一致。

    - id: offline-workflows
      title: 第七章：tracegen、sweep 和 viz 如何复用持久化契约

      steps:
        - id: tracegen-registry
          title: Generator registry 隔离不同来源的参数，统一输出 canonical trace

          primary:
            file: src/bin/tracegen/generator/mod.rs
            range:
              start_line: 30
              end_line: 70

          explanation: |
            每个 generator 只负责产生 canonical `ExecutionRow`，并记录足以重现输入的参数；
            tracegen 的共享入口统一写出 CSV、manifest、plan 和 hashes。registry 用不同
            subcommand 表示 coding-session 与 synthetic，因此用户只会看到当前 generator
            有效的参数，而不是一大组互斥的 optional flags。两种来源分别通过
            [recorded trace materializer](code-ref:coding-generator) 和
            [synthetic distribution generator](code-ref:synthetic-generator) 实现同一个 trait。

          related:
            - id: tracegen-output
              title: 统一写出 manifest、plan 和 checksum
              location:
                file: src/bin/tracegen/main.rs
                range:
                  start_line: 44
                  end_line: 176
            - id: coding-generator
              title: 把 coding-agent sessions 转换为 canonical rows
              location:
                file: src/bin/tracegen/generator/coding_session.rs
                range:
                  start_line: 122
                  end_line: 235
            - id: synthetic-generator
              title: 根据 distributions 生成可重复的 synthetic sessions
              location:
                file: src/bin/tracegen/generator/synthetic.rs
                range:
                  start_line: 92
                  end_line: 188

        - id: sweep-search
          title: Search state machine 只决定下一个 rate，不负责运行测量

          primary:
            file: src/bin/sweep/search.rs
            range:
              start_line: 91
              end_line: 190

          explanation: |
            调用方通过 `next_rate` 取得下一个测量点，再用 `record` 回传结果；`Search` 依次
            执行 ramp、bisect 和 densify，但不访问网络或文件系统，所以 bracket policy 可以
            用确定性单元测试验证。每个 rate 如何运行和恢复由 [point runner](code-ref:sweep-point)
            负责，测量点是否越过边界由 [boundary policy](code-ref:sweep-boundary) 判断；
            两者都不会把执行细节写进 search state machine。

          related:
            - id: sweep-point
              title: point 目录、完成记录与 run 复用
              location:
                file: src/bin/sweep/point.rs
                range:
                  start_line: 23
                  end_line: 145
            - id: sweep-boundary
              title: saturation/SLO 判定与到达单位换算
              location:
                file: src/bin/sweep/boundary.rs
                range:
                  start_line: 22
                  end_line: 157

        - id: visualization
          title: viz 只读取 sweep、JSONL 和 Arrow 产物，并沿用同一单位换算

          primary:
            file: viz/src/req_frontend_viz/load.py
            range:
              start_line: 33
              end_line: 178

          explanation: |
            loader 把 sweep report 和各个 point 目录解析为 Python dataclass，并保留 knee、
            unit label、steps-per-unit、SLO 和污染警告等字段。[绘图函数](code-ref:sweep-plots)
            只根据这些已持久化的数据生成 throughput、attainment、latency 和 token-arrival
