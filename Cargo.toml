[package]
name = "req-frontend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Request Factory: typed workload runner for OpenAI-compatible inference servers"

# Shared between the replay runtime, the trace generator, and any other program
# that reads the same files: all of them must agree on what a trace *is*, so the
# schemas live in one library rather than being reimplemented per consumer.
[lib]
name = "req_frontend"
path = "src/lib.rs"

[[bin]]
name = "session_runner"
path = "src/main.rs"
required-features = ["runtime"]

[[bin]]
name = "tracegen"
path = "src/bin/tracegen/main.rs"
required-features = ["runtime"]

[[bin]]
name = "sweep"
path = "src/bin/sweep/main.rs"
required-features = ["runtime"]

[[bin]]
name = "selfcheck"
path = "src/bin/selfcheck/main.rs"
required-features = ["runtime"]

[[bin]]
name = "loadgen_transport_bench"
path = "src/bin/loadgen_transport_bench.rs"
required-features = ["transport-bench"]

[features]
default = ["runtime"]
bench-internals = ["runtime"]
transport-bench = ["runtime", "dep:hyper"]

# The replay runtime: the HTTP client, the tokenizer, the CLI, the executors.
#
# Split out because the largest consumer of this crate does not want any of it.
# A simulator reading the same trace files needs `schema` and nothing else, and
# should not pay reqwest, tokio and tokenizers to get it. Such a
# consumer takes `default-features = false`.
runtime = [
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:bytes",
    "dep:base64",
    "dep:clap",
    "dep:fdlimit",
    "dep:futures",
    "dep:ureq",
    "dep:parquet",
    "dep:reqwest",
    "dep:sha2",
    "dep:tokenizers",
    "dep:tokio",
    "dep:tokio-tungstenite",
]

[dependencies]
# Always on: what it takes to describe and read a trace file.
anyhow = "1.0"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Runtime only.
# Arrow arrays + the Parquet writer for the per-event timeline. A columnar file
# because the timeline is one row per streamed event over a whole run -- tens of
# millions of rows whose columns are three integers and two low-cardinality
# strings, which is exactly what dictionary encoding and RLE are for.
arrow-array = { version = "55", optional = true }
arrow-schema = { version = "55", optional = true }
parquet = { version = "55", default-features = false, features = ["arrow", "zstd"], optional = true }
bytes = { version = "1.5", optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
fdlimit = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
# Hub downloads are one file over HTTPS. `hf-hub` did this until the Hub
# began answering with a *relative* redirect, which its 0.3 line parses as an
# absolute URL and rejects; its 1.0 line drags in a dependency tree that does
# not currently resolve. `ureq` resolves the redirect against the request URL,
# which is the whole of what was needed.
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"], optional = true }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"], optional = true }
hyper = { version = "0.14", features = ["client", "http1", "tcp"], optional = true }
sha2 = { version = "0.10", optional = true }
tokenizers = { version = "0.21", optional = true }
tokio = { version = "1.36", features = ["full"], optional = true }
# The realtime surface is a WebSocket, which reqwest does not speak.
tokio-tungstenite = { version = "0.21", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "dispatch"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "vllm_wire"
harness = false
required-features = ["bench-internals"]

# This crate is also vendored as a submodule below larger Rust workspaces. Keep
# it an independent workspace so Cargo never inherits the host repository's
# members, target directory, or dependency policy.
[workspace]

[[bench]]
name = "chat_wire"
harness = false
required-features = ["bench-internals"]
