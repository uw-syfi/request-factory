[package]
name = "tracelab-session-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Typed workload runner for OpenAI-compatible inference servers"

# Shared between the replay runtime and the trace generator: both must read and
# validate the canonical execution trace by identical rules, so the schema lives
# in one library rather than being reimplemented per binary.
[lib]
name = "tracelab_replay"
path = "src/lib.rs"

[[bin]]
name = "session_runner"
path = "src/main.rs"

[[bin]]
name = "tracegen"
path = "src/bin/tracegen/main.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.5"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
fdlimit = "0.3"
futures = "0.3"
hf-hub = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.21"
tokio = { version = "1.36", features = ["full"] }

# TraceLab is also vendored as a submodule below larger Rust workspaces. Keep
# its replay runner an independent workspace so Cargo never inherits the host
# repository's members, target directory, or dependency policy.
[workspace]
